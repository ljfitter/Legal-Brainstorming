<style>
  :root {
    --ink: #111111;
    --paper: #F1F1F1;
    --surface: #E9E9E9;
    --surface-2: #FFFFFF;
    --line: #D2D2D2;
    --muted: #666666;
    --accent: #111111;
    --accent-soft: #E4E4E4;
    --accent-ink: #FFFFFF;
    --shadow: rgba(0,0,0,0.14);

    --critical: #d03b3b;
    --warning: #b8862e;

    --stage-draft: #B9C3E6;
    --stage-reviewed: #8C9AD1;
    --stage-backlog: #5E71B9;
    --stage-verified: #3A4E93;
    --stage-closed: #232F5E;

    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --font-ui: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #F1F1F1;
      --paper: #0C0C0C;
      --surface: #161616;
      --surface-2: #1E1E1E;
      --line: #333333;
      --muted: #999999;
      --accent: #F1F1F1;
      --accent-soft: #2A2A2A;
      --accent-ink: #111111;
      --shadow: rgba(0,0,0,0.5);

      --stage-draft: #45528A;
      --stage-reviewed: #56699E;
      --stage-backlog: #6D82BB;
      --stage-verified: #8D9EDA;
      --stage-closed: #C2CCEC;
    }
  }
  :root[data-theme="dark"] {
    --ink: #F1F1F1;
    --paper: #0C0C0C;
    --surface: #161616;
    --surface-2: #1E1E1E;
    --line: #333333;
    --muted: #999999;
    --accent: #F1F1F1;
    --accent-soft: #2A2A2A;
    --accent-ink: #111111;
    --shadow: rgba(0,0,0,0.5);
    --stage-draft: #45528A;
    --stage-reviewed: #56699E;
    --stage-backlog: #6D82BB;
    --stage-verified: #8D9EDA;
    --stage-closed: #C2CCEC;
  }
  :root[data-theme="light"] {
    --ink: #111111;
    --paper: #F1F1F1;
    --surface: #E9E9E9;
    --surface-2: #FFFFFF;
    --line: #D2D2D2;
    --muted: #666666;
    --accent: #111111;
    --accent-soft: #E4E4E4;
    --accent-ink: #FFFFFF;
    --shadow: rgba(0,0,0,0.14);
    --stage-draft: #B9C3E6;
    --stage-reviewed: #8C9AD1;
    --stage-backlog: #5E71B9;
    --stage-verified: #3A4E93;
    --stage-closed: #232F5E;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14.5px;
    line-height: 1.5;
  }

  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent-soft); }

  #app { height: 100vh; overflow: hidden; }
  .shell {
    display: grid;
    grid-template-columns: 236px 1fr;
    height: 100%;
  }

  /* ---------- Rail ---------- */
  .rail {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 22px 16px;
    gap: 22px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; }
  .brand .mark {
    font-family: var(--font-display);
    font-size: 26px;
    color: var(--accent);
    line-height: 1;
  }
  .brand-name { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.2px; text-wrap: balance; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    text-align: left;
    background: transparent;
    border: none;
    border-left: 2px solid transparent;
    padding: 9px 12px;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
    color: var(--ink);
    font-size: 13.5px;
  }
  .nav-item:hover { background: var(--accent-soft); }
  .nav-item.active { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .nav-count { float: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }

  .rail-footer { margin-top: auto; }
  .cadence {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    background: var(--surface-2);
  }
  .cadence-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  .cadence-value { font-family: var(--font-mono); font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .cadence-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .cadence-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
    font-size: 12px;
  }
  .cadence-btn:hover { border-color: var(--accent); color: var(--accent); }
  .databox { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface-2); margin-top: 10px; }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .topbar {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .topbar h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
  .topbar p { margin: 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--accent-soft); border-color: transparent; }
  .btn-danger { color: var(--critical); border-color: var(--critical); background: transparent; }
  .btn-danger:hover { background: var(--critical); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .content { flex: 1; overflow-y: auto; padding: 24px 32px 48px; }

  /* ---------- Filter bar ---------- */
  .filterbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .filterbar input[type="search"], .filterbar select {
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 7px;
    padding: 7px 10px;
    min-width: 160px;
  }
  .filterbar input[type="search"] { flex: 1; min-width: 200px; }
  .filter-spacer { flex: 1; }

  /* ---------- Stat tiles ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat-tile .num { font-family: var(--font-display); font-size: 30px; line-height: 1.1; }
  .stat-tile .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .stat-tile.accent .num { color: var(--accent); }
  .stat-tile.critical .num { color: var(--critical); }

  .panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; }
  .panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 16px; margin: 0 0 14px; }

  /* ---------- Stacked bar viz ---------- */
  .stackbar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--paper); }
  .stackbar .seg { display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: #fff; font-variant-numeric: tabular-nums; border-right: 2px solid var(--surface-2); }
  .stackbar .seg:last-child { border-right: none; }
  .viz-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .viz-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .viz-legend-item .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .viz-legend-item .count { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---------- Card list ---------- */
  .card-row {
    display: grid;
    grid-template-columns: 4px 1fr auto;
    align-items: stretch;
    gap: 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    margin-bottom: 10px;
    cursor: pointer;
    overflow: hidden;
  }
  .card-row:hover { border-color: var(--accent); }
  .card-row .stripe { background: var(--tier-color, var(--muted)); }
  .card-row .body { padding: 13px 14px 13px 4px; min-width: 0; }
  .card-row .top-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card-row .id { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .card-row .title { font-weight: 600; font-size: 14px; }
  .card-row .statement { color: var(--muted); font-size: 12.5px; margin-top: 4px; max-width: 70ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-row .meta-line { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .card-row .side { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; padding: 13px 16px 13px 0; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 3px 8px; border-radius: 20px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot-color, var(--muted)); flex: none; }
  .chip-epic { color: var(--muted); }

  .progress-mini { width: 70px; height: 5px; border-radius: 3px; background: var(--paper); overflow: hidden; }
  .progress-mini > span { display: block; height: 100%; background: var(--accent); }

  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .empty .mark { font-family: var(--font-display); font-size: 34px; color: var(--accent); }

  /* ---------- Matrix table ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
  table.matrix { border-collapse: collapse; width: 100%; min-width: 980px; }
  table.matrix th, table.matrix td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.matrix th {
    position: sticky; top: 0; background: var(--surface);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 600;
  }
  table.matrix tbody tr { cursor: pointer; }
  table.matrix tbody tr:hover { background: var(--accent-soft); }
  table.matrix td.mono { font-family: var(--font-mono); font-size: 12px; }
  table.matrix tbody tr:last-child td { border-bottom: none; }

  /* ---------- Kanban ---------- */
  .kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; align-items: start; }
  .kcol { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 120px; display: flex; flex-direction: column; }
  .kcol-head { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
  .kcol-head .n { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
  .kcol-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 60px; }
  .kcol-body.dragover { background: var(--accent-soft); }
  .kcard {
    background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--tier-color, var(--muted));
    border-radius: 7px; padding: 9px 10px; cursor: grab;
  }
  .kcard:hover { border-color: var(--accent); }
  .kcard .id { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .kcard .title { font-size: 12.5px; font-weight: 600; margin-top: 2px; text-wrap: balance; }
  .kcard .kfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .kcard .owner { font-size: 11px; color: var(--muted); }
  .kmove { display: flex; gap: 3px; }
  .kmove button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; width: 20px; height: 20px; cursor: pointer; line-height: 1; padding: 0; }
  .kmove button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .kmove button:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ---------- Drawer ---------- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
    opacity: 0; pointer-events: none; transition: opacity 180ms ease;
    z-index: 10;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; width: 380px; max-width: 90vw; z-index: 12; box-shadow: 0 12px 32px var(--shadow);
  }
  .modal h2 { font-family: var(--font-display); font-weight: 400; font-size: 17px; margin: 0 0 10px; }
  .modal p { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 440px; max-width: 92vw;
    background: var(--surface-2); border-left: 1px solid var(--line);
    box-shadow: -12px 0 32px var(--shadow);
    transform: translateX(100%); transition: transform 220ms ease;
    z-index: 11; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .drawer-head .id { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .drawer-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 19px; margin: 3px 0 0; text-wrap: balance; }
  .drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .drawer-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 5px; }
  .field .value { font-size: 13.5px; }
  .field .statement-quote { font-family: var(--font-display); font-style: italic; font-size: 15px; line-height: 1.5; max-width: 62ch; }
  .field input[type="text"], .field input[type="date"], .field select, .field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 8px 10px;
  }
  .field textarea { min-height: 64px; resize: vertical; font-family: var(--font-ui); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .ac-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ac-row input[type="checkbox"] { width: 16px; height: 16px; flex: none; accent-color: var(--accent); }
  .ac-row .ac-text-static { flex: 1; font-size: 13px; }
  .ac-row .ac-text-static.done { text-decoration: line-through; color: var(--muted); }
  .ac-row input[type="text"] { flex: 1; }
  .ac-row button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; width: 22px; }
  .ac-row button:hover { color: var(--critical); }
  .ac-add { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 4px 0; }

  .divider { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .copied-flash { color: var(--accent); font-size: 12px; margin-left: 8px; }

  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { flex-direction: row; align-items: center; overflow-x: auto; padding: 12px 16px; }
    .rail .nav { flex-direction: row; }
    .rail-footer { margin-top: 0; margin-left: auto; }
    .brand-sub { display: none; }
    .kanban { grid-template-columns: 1fr; }
    .drawer { width: 100%; max-width: 100%; }
  }
</style>

<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "docket.cards.v2";
  var META_KEY = "docket.meta.v2";
  var STATUSES = ["Draft", "Reviewed", "Attached to backlog", "Verified at demo", "Closed"];
  var STATUS_VAR = {
    "Draft": "--stage-draft",
    "Reviewed": "--stage-reviewed",
    "Attached to backlog": "--stage-backlog",
    "Verified at demo": "--stage-verified",
    "Closed": "--stage-closed"
  };
  var RISK_LABEL = { P0: "P0 · Blocking", P1: "P1 · Advisory", P2: "P2 · Monitor" };
  var RISK_VAR = { P0: "--critical", P1: "--warning", P2: "--muted" };

  function seedCards() {
    return [
      {
        id: "LRC-2026-014",
        title: "Age verification for EU minors in ad targeting",
        source: "Digital Services Act, Art. 28(1)",
        statement: "The product MUST NOT profile minors for advertising purposes when the platform has actual knowledge of the user's age.",
        appliesTo: "Ad Targeting v2",
        designSpec: "Design Spec §4.2 Age Gate",
        riskTier: "P0",
        ac: [
          { text: "Age-gate flag excludes users flagged under 18 from the ad-personalization pipeline", done: true },
          { text: "Audit log records the exclusion decision per Art. 28 recordkeeping expectations", done: true }
        ],
        testCaseId: "TC-331",
        status: "Verified at demo",
        legalOwner: "L. Fitter",
        engOwner: "A. Chen",
        lastReviewed: "2026-07-06",
        notes: ""
      },
      {
        id: "LRC-2026-015",
        title: "CCPA ‘Do Not Sell/Share’ link placement",
        source: "Cal. Civ. Code §1798.135",
        statement: "The product MUST provide a clear and conspicuous ‘Do Not Sell or Share My Personal Information’ link on the homepage for California residents.",
        appliesTo: "Consent Center Redesign",
        designSpec: "Design Spec §2.1 Footer Links",
        riskTier: "P1",
        ac: [
          { text: "Link renders in the footer for visitors geolocated to California", done: false },
          { text: "Link routes to the opt-out preference center within two clicks", done: false }
        ],
        testCaseId: "TC-402",
        status: "Attached to backlog",
        legalOwner: "L. Fitter",
        engOwner: "R. Osei",
        lastReviewed: "2026-06-29",
        notes: "Waiting on eng estimate for the geolocation service."
      },
      {
        id: "LRC-2026-016",
        title: "COPPA parental consent for under-13 signup",
        source: "16 CFR §312.5",
        statement: "The product MUST obtain verifiable parental consent before collecting personal information from users the platform knows are under 13.",
        appliesTo: "Onboarding Flow v3",
        designSpec: "Design Spec §1.4 Age Gate & Consent",
        riskTier: "P0",
        ac: [
          { text: "Signup blocks account creation pending verified parental consent", done: false },
          { text: "Consent record is retained for the FTC audit window", done: false }
        ],
        testCaseId: "",
        status: "Reviewed",
        legalOwner: "L. Fitter",
        engOwner: "",
        lastReviewed: "2026-07-02",
        notes: "Legal research complete; needs eng sizing before it enters the backlog."
      },
      {
        id: "LRC-2026-017",
        title: "WCAG 2.2 AA conformance for checkout",
        source: "ADA Title III / WCAG 2.2 AA",
        statement: "The checkout flow SHOULD conform to WCAG 2.2 Level AA success criteria to mitigate ADA Title III litigation risk.",
        appliesTo: "Checkout Redesign",
        designSpec: "Design Spec §5 Accessibility",
        riskTier: "P2",
        ac: [
          { text: "Automated axe-core scan passes on all checkout routes", done: false }
        ],
        testCaseId: "",
        status: "Draft",
        legalOwner: "L. Fitter",
        engOwner: "",
        lastReviewed: "2026-07-05",
        notes: "Monitoring only for now; escalate if the litigation trend continues."
      }
    ];
  }

  function loadCards() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    var seeded = seedCards();
    saveCards(seeded);
    return seeded;
  }
  function saveCards(cards) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); } catch (e) {}
  }
  function loadMeta() {
    try {
      var raw = localStorage.getItem(META_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { researchSprint: 14 };
  }
  function saveMeta(meta) {
    try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
  }

  var state = {
    cards: loadCards(),
    meta: loadMeta(),
    view: "overview",
    filters: { query: "", risk: "all", status: "all", sort: "reviewed-desc" },
    selectedId: null,
    drawerOpen: false,
    drawerMode: "view", // view | edit | create
    deleteArmed: null,
    pendingImport: null,
    importError: null
  };

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function findCard(id) {
    for (var i = 0; i < state.cards.length; i++) if (state.cards[i].id === id) return state.cards[i];
    return null;
  }

  function nextId() {
    var year = new Date().getFullYear();
    var max = 0;
    state.cards.forEach(function (c) {
      var m = /^LRC-(\d{4})-(\d+)$/.exec(c.id);
      if (m && parseInt(m[1], 10) === year) max = Math.max(max, parseInt(m[2], 10));
    });
    var n = max + 1;
    return "LRC-" + year + "-" + String(n).padStart(3, "0");
  }

  function acDone(card) { return card.ac.filter(function (a) { return a.done; }).length; }

  function daysAgo(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr + "T00:00:00");
    var now = new Date("2026-07-06T00:00:00");
    return Math.round((now - d) / 86400000);
  }

  /* ---------------- Rendering ---------------- */

  function render() {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="shell">' +
        renderRail() +
        '<main class="main">' + renderTopbar() + '<div class="content" id="content">' + renderContent() + '</div></main>' +
      '</div>' +
      '<div class="backdrop' + (state.drawerOpen ? ' open' : '') + '" data-action="close-drawer"></div>' +
      renderDrawer() +
      (state.pendingImport ? renderImportModal() : "");
    if (state.view === "cards") {
      var rc = document.getElementById("resultsContainer");
      if (rc) rc.innerHTML = renderResultsList();
    }
  }

  function countBy(pred) { return state.cards.filter(pred).length; }

  function renderRail() {
    var navItems = [
      ["overview", "Overview"],
      ["cards", "Requirement Cards"],
      ["matrix", "Traceability Matrix"],
      ["planning", "Planning Board"]
    ];
    var nav = navItems.map(function (item) {
      var active = state.view === item[0] ? " active" : "";
      var count = "";
      if (item[0] === "cards" || item[0] === "matrix") count = '<span class="nav-count">' + state.cards.length + '</span>';
      if (item[0] === "planning") count = '<span class="nav-count">' + countBy(function (c) { return c.status !== "Closed"; }) + '</span>';
      return '<button class="nav-item' + active + '" data-action="nav" data-view="' + item[0] + '">' + item[1] + count + '</button>';
    }).join("");

    return (
      '<aside class="rail">' +
        '<div class="brand"><span class="mark">§</span><div><div class="brand-name">The Docket</div><div class="brand-sub">Legal research &amp; delivery tracker</div></div></div>' +
        '<nav class="nav">' + nav + '</nav>' +
        '<div class="rail-footer">' +
          '<div class="cadence">' +
            '<div class="cadence-label">Cadence</div>' +
            '<div class="cadence-value">Research sprint ' + state.meta.researchSprint + ' → Delivery sprint ' + (state.meta.researchSprint + 1) + '</div>' +
            '<div class="cadence-row"><span style="font-size:11px;color:var(--muted)">One sprint ahead</span><button class="cadence-btn" data-action="advance-sprint">Advance →</button></div>' +
          '</div>' +
          '<div class="databox">' +
            '<div class="cadence-label">Data <span style="text-transform:none;letter-spacing:0;">— this browser only</span></div>' +
            '<div class="cadence-row" style="justify-content:flex-start;gap:6px;">' +
              '<button class="cadence-btn" data-action="export-json">Export</button>' +
              '<button class="cadence-btn" data-action="import-json">Import</button>' +
              '<span class="copied-flash" id="exportFlash" style="display:none;">Copied</span>' +
            '</div>' +
            (state.importError ? '<div style="font-size:11px;color:var(--critical);margin-top:6px;">' + escapeHtml(state.importError) + '</div>' : '') +
            '<input type="file" id="importFile" accept="application/json" style="display:none;">' +
          '</div>' +
        '</div>' +
      '</aside>'
    );
  }

  var VIEW_COPY = {
    overview: ["Overview", "Where legal research stands relative to the delivery sprint it feeds."],
    cards: ["Requirement Cards", "Atomic legal findings, one per requirement — filter, open, and revise as research develops."],
    matrix: ["Traceability Matrix", "Every legal requirement mapped forward to the design spec, acceptance criteria, and test case that discharge it."],
    planning: ["Planning Board", "Drag a card across its research-to-delivery stages, or use the arrows."]
  };

  function renderTopbar() {
    var copy = VIEW_COPY[state.view];
    var actions = '<button class="btn btn-primary" data-action="new-card">+ New requirement</button>';
    return (
      '<header class="topbar">' +
        '<div><h1>' + copy[0] + '</h1><p>' + copy[1] + '</p></div>' +
        '<div class="topbar-actions">' + actions + '</div>' +
      '</header>'
    );
  }

  function renderContent() {
    if (state.view === "overview") return renderOverview();
    if (state.view === "cards") return renderCardsView();
    if (state.view === "matrix") return renderMatrixView();
    if (state.view === "planning") return renderPlanningView();
    return "";
  }

  /* ----- Overview ----- */
  function renderOverview() {
    var open = state.cards.filter(function (c) { return c.status !== "Closed"; });
    var p0Open = countBy(function (c) { return c.riskTier === "P0" && c.status !== "Closed" && c.status !== "Verified at demo"; });
    var verified = countBy(function (c) { return c.status === "Verified at demo" || c.status === "Closed"; });
    var inResearch = countBy(function (c) { return c.status === "Draft" || c.status === "Reviewed"; });

    var stats =
      '<div class="stat-grid">' +
        statTile(state.cards.length, "Total requirements", "") +
        statTile(inResearch, "In research (N−1)", "") +
        statTile(p0Open, "P0 blocking, open", p0Open > 0 ? "critical" : "") +
        statTile(verified, "Verified or closed", "accent") +
      '</div>';

    var stageCounts = STATUSES.map(function (s) { return countBy(function (c) { return c.status === s; }); });
    var stageTotal = state.cards.length || 1;
    var stageBar = '<div class="stackbar">' + STATUSES.map(function (s, i) {
      var n = stageCounts[i];
      if (n === 0) return "";
      var pct = (n / stageTotal * 100).toFixed(1);
      var label = n / stageTotal >= 0.12 ? n : "";
      return '<div class="seg" style="width:' + pct + '%;background:var(' + STATUS_VAR[s] + ')" title="' + s + ': ' + n + '">' + label + '</div>';
    }).join("") + '</div>';
    var stageLegend = '<div class="viz-legend">' + STATUSES.map(function (s, i) {
      return '<div class="viz-legend-item"><span class="swatch" style="background:var(' + STATUS_VAR[s] + ')"></span>' + s + ' <span class="count">' + stageCounts[i] + '</span></div>';
    }).join("") + '</div>';

    var riskCounts = { P0: countBy(function (c) { return c.riskTier === "P0"; }), P1: countBy(function (c) { return c.riskTier === "P1"; }), P2: countBy(function (c) { return c.riskTier === "P2"; }) };
    var riskTotal = state.cards.length || 1;
    var riskBar = '<div class="stackbar">' + ["P0", "P1", "P2"].map(function (t) {
      var n = riskCounts[t];
      if (n === 0) return "";
      var pct = (n / riskTotal * 100).toFixed(1);
      var label = n / riskTotal >= 0.12 ? n : "";
      return '<div class="seg" style="width:' + pct + '%;background:var(' + RISK_VAR[t] + ')" title="' + RISK_LABEL[t] + ': ' + n + '">' + label + '</div>';
    }).join("") + '</div>';
    var riskLegend = '<div class="viz-legend">' + ["P0", "P1", "P2"].map(function (t) {
      return '<div class="viz-legend-item"><span class="swatch" style="background:var(' + RISK_VAR[t] + ')"></span>' + RISK_LABEL[t] + ' <span class="count">' + riskCounts[t] + '</span></div>';
    }).join("") + '</div>';

    var upcoming = open.filter(function (c) { return c.status === "Draft" || c.status === "Reviewed"; })
      .sort(function (a, b) { return (a.riskTier > b.riskTier ? 1 : -1); });

    var upcomingList = upcoming.length
      ? upcoming.map(function (c) { return miniRow(c); }).join("")
      : '<p style="color:var(--muted);font-size:13px;margin:0;">Nothing in research right now — plan ahead by adding a requirement for an upcoming epic.</p>';

    return (
      stats +
      '<div class="panel"><h2>Delivery pipeline</h2>' + stageBar + stageLegend + '</div>' +
      '<div class="panel"><h2>Risk mix</h2>' + riskBar + riskLegend + '</div>' +
      '<div class="panel"><h2>Feeding the next sprint</h2>' + upcomingList + '</div>'
    );
  }

  function statTile(num, label, cls) {
    return '<div class="stat-tile ' + (cls || "") + '"><div class="num">' + num + '</div><div class="label">' + label + '</div></div>';
  }

  function miniRow(c) {
    return (
      '<div class="card-row" style="--tier-color:var(' + RISK_VAR[c.riskTier] + ')" data-action="open-card" data-id="' + c.id + '">' +
        '<div class="stripe"></div>' +
        '<div class="body">' +
          '<div class="top-line"><span class="id">' + c.id + '</span><span class="title">' + escapeHtml(c.title) + '</span></div>' +
          '<div class="meta-line">' +
            chip(RISK_LABEL[c.riskTier], RISK_VAR[c.riskTier]) +
            '<span class="chip chip-epic">' + escapeHtml(c.appliesTo || "—") + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="side"><span class="chip"><span class="dot" style="--dot-color:var(' + STATUS_VAR[c.status] + ')"></span>' + c.status + '</span></div>' +
      '</div>'
    );
  }

  function chip(label, colorVar) {
    return '<span class="chip"><span class="dot" style="--dot-color:var(' + colorVar + ')"></span>' + label + '</span>';
  }

  /* ----- Cards view ----- */
  function filteredSortedCards() {
    var f = state.filters;
    var list = state.cards.filter(function (c) {
      if (f.risk !== "all" && c.riskTier !== f.risk) return false;
      if (f.status !== "all" && c.status !== f.status) return false;
      if (f.query) {
        var q = f.query.toLowerCase();
        var hay = (c.id + " " + c.title + " " + c.source + " " + c.appliesTo).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    list.sort(function (a, b) {
      switch (f.sort) {
        case "reviewed-desc": return (b.lastReviewed || "").localeCompare(a.lastReviewed || "");
        case "risk": return a.riskTier.localeCompare(b.riskTier);
        case "status": return STATUSES.indexOf(a.status) - STATUSES.indexOf(b.status);
        case "title": return a.title.localeCompare(b.title);
        default: return 0;
      }
    });
    return list;
  }

  function renderFilterBar() {
    var f = state.filters;
    function opt(v, label, cur) { return '<option value="' + v + '"' + (v === cur ? " selected" : "") + '>' + label + '</option>'; }
    return (
      '<div class="filterbar">' +
        '<input type="search" id="searchInput" placeholder="Search title, citation, epic…" value="' + escapeAttr(f.query) + '">' +
        '<select id="riskSelect">' + opt("all", "All risk tiers", f.risk) + opt("P0", "P0 Blocking", f.risk) + opt("P1", "P1 Advisory", f.risk) + opt("P2", "P2 Monitor", f.risk) + '</select>' +
        '<select id="statusSelect">' + opt("all", "All statuses", f.status) + STATUSES.map(function (s) { return opt(s, s, f.status); }).join("") + '</select>' +
        '<select id="sortSelect">' + opt("reviewed-desc", "Sort: last reviewed", f.sort) + opt("risk", "Sort: risk tier", f.sort) + opt("status", "Sort: pipeline stage", f.sort) + opt("title", "Sort: title", f.sort) + '</select>' +
      '</div>' +
      '<div id="resultsContainer"></div>'
    );
  }

  function renderCardsView() {
    return renderFilterBar();
  }

  function renderResultsList() {
    var list = filteredSortedCards();
    if (!list.length) {
      return '<div class="empty"><div class="mark">§</div><p>No requirement cards match this filter.</p></div>';
    }
    return list.map(function (c) {
      var done = acDone(c), total = c.ac.length;
      var pct = total ? Math.round(done / total * 100) : 0;
      return (
        '<div class="card-row" style="--tier-color:var(' + RISK_VAR[c.riskTier] + ')" data-action="open-card" data-id="' + c.id + '">' +
          '<div class="stripe"></div>' +
          '<div class="body">' +
            '<div class="top-line"><span class="id">' + c.id + '</span><span class="title">' + escapeHtml(c.title) + '</span></div>' +
            '<div class="statement">' + escapeHtml(c.statement) + '</div>' +
            '<div class="meta-line">' +
              chip(RISK_LABEL[c.riskTier], RISK_VAR[c.riskTier]) +
              '<span class="chip chip-epic">' + escapeHtml(c.appliesTo || "—") + '</span>' +
              (total ? '<span class="progress-mini"><span style="width:' + pct + '%"></span></span><span style="font-size:11px;color:var(--muted)">' + done + '/' + total + ' AC</span>' : "") +
            '</div>' +
          '</div>' +
          '<div class="side">' +
            '<span class="chip"><span class="dot" style="--dot-color:var(' + STATUS_VAR[c.status] + ')"></span>' + c.status + '</span>' +
            '<span style="font-size:11px;color:var(--muted)">reviewed ' + (c.lastReviewed || "—") + '</span>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  /* ----- Matrix view ----- */
  function renderMatrixView() {
    var list = filteredSortedCards();
    var rows = list.map(function (c) {
      var acSummary = c.ac.length ? acDone(c) + "/" + c.ac.length + " done" : "—";
      return (
        '<tr data-action="open-card" data-id="' + c.id + '">' +
          '<td class="mono">' + c.id + '</td>' +
          '<td>' + escapeHtml(c.source) + '</td>' +
          '<td>' + chip(RISK_LABEL[c.riskTier], RISK_VAR[c.riskTier]) + '</td>' +
          '<td>' + escapeHtml(c.appliesTo || "—") + '</td>' +
          '<td>' + escapeHtml(c.designSpec || "—") + '</td>' +
          '<td>' + acSummary + '</td>' +
          '<td class="mono">' + escapeHtml(c.testCaseId || "—") + '</td>' +
          '<td>' + c.status + '</td>' +
          '<td>' + escapeHtml(c.legalOwner || "—") + '</td>' +
          '<td>' + escapeHtml(c.engOwner || "—") + '</td>' +
          '<td class="mono">' + (c.lastReviewed || "—") + '</td>' +
        '</tr>'
      );
    }).join("");

    return (
      renderFilterBar() +
      '<div style="display:flex;justify-content:flex-end;margin:14px 0 10px;">' +
        '<button class="btn" id="copyCsvBtn" data-action="copy-csv">Copy as CSV</button><span class="copied-flash" id="copyFlash" style="display:none;">Copied</span>' +
      '</div>' +
      '<div class="table-wrap"><table class="matrix"><thead><tr>' +
        '<th>LRC ID</th><th>Source</th><th>Risk</th><th>Epic / Story</th><th>Design spec</th><th>Acceptance criteria</th><th>Test case</th><th>Status</th><th>Legal owner</th><th>Eng owner</th><th>Last reviewed</th>' +
      '</tr></thead><tbody id="matrixBody">' + rows + '</tbody></table></div>'
    );
  }

  /* ----- Planning view ----- */
  function renderPlanningView() {
    var cols = STATUSES.map(function (s) {
      var items = state.cards.filter(function (c) { return c.status === s; });
      var body = items.length ? items.map(function (c) {
        var idx = STATUSES.indexOf(s);
        return (
          '<div class="kcard" draggable="true" data-action="open-card" data-id="' + c.id + '" data-drag-id="' + c.id + '" style="--tier-color:var(' + RISK_VAR[c.riskTier] + ')">' +
            '<div class="id">' + c.id + '</div>' +
            '<div class="title">' + escapeHtml(c.title) + '</div>' +
            '<div class="kfoot">' +
              '<span class="owner">' + escapeHtml(c.legalOwner || "—") + '</span>' +
              '<span class="kmove">' +
                '<button data-action="move-back" data-id="' + c.id + '" ' + (idx === 0 ? "disabled" : "") + ' aria-label="Move back" title="Move back">←</button>' +
                '<button data-action="move-fwd" data-id="' + c.id + '" ' + (idx === STATUSES.length - 1 ? "disabled" : "") + ' aria-label="Advance" title="Advance">→</button>' +
              '</span>' +
            '</div>' +
          '</div>'
        );
      }).join("") : "";
      return (
        '<div class="kcol">' +
          '<div class="kcol-head"><span>' + s + '</span><span class="n">' + items.length + '</span></div>' +
          '<div class="kcol-body" data-action="kcol" data-status="' + s + '">' + body + '</div>' +
        '</div>'
      );
    }).join("");
    return '<div class="kanban">' + cols + '</div>';
  }

  /* ----- Drawer ----- */
  function renderDrawer() {
    if (!state.drawerOpen) return '<aside class="drawer"></aside>';
    var mode = state.drawerMode;
    var card = state.selectedId ? findCard(state.selectedId) : null;

    if (mode === "create" || (mode === "edit" && card)) {
      return '<aside class="drawer open">' + renderForm(mode === "edit" ? card : null) + '</aside>';
    }
    if (card) {
      return '<aside class="drawer open">' + renderView(card) + '</aside>';
    }
    return '<aside class="drawer"></aside>';
  }

  function renderView(c) {
    var done = acDone(c), total = c.ac.length;
    var acRows = c.ac.map(function (a, i) {
      return (
        '<div class="ac-row">' +
          '<input type="checkbox" ' + (a.done ? "checked" : "") + ' data-action="toggle-ac" data-id="' + c.id + '" data-idx="' + i + '">' +
          '<span class="ac-text-static' + (a.done ? " done" : "") + '">' + escapeHtml(a.text) + '</span>' +
        '</div>'
      );
    }).join("") || '<p style="color:var(--muted);font-size:13px;">No acceptance criteria yet.</p>';

    var deleteBtn = state.deleteArmed === c.id
      ? '<button class="btn btn-danger" data-action="confirm-delete" data-id="' + c.id + '">Confirm delete</button>'
      : '<button class="btn btn-ghost" data-action="arm-delete" data-id="' + c.id + '" style="color:var(--critical)">Delete</button>';

    return (
      '<div class="drawer-head"><div><div class="id">' + c.id + '</div><h2>' + escapeHtml(c.title) + '</h2></div>' +
        '<button class="btn btn-ghost" data-action="close-drawer" aria-label="Close">✕</button></div>' +
      '<div class="drawer-body">' +
        '<div class="field"><label>Source</label><div class="value">' + escapeHtml(c.source) + '</div></div>' +
        '<div class="field"><label>Requirement</label><div class="statement-quote">“' + escapeHtml(c.statement) + '”</div></div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Risk tier</label><div class="value">' + chip(RISK_LABEL[c.riskTier], RISK_VAR[c.riskTier]) + '</div></div>' +
          '<div class="field"><label>Status</label><select data-action="quick-status" data-id="' + c.id + '">' +
            STATUSES.map(function (s) { return '<option value="' + s + '"' + (s === c.status ? " selected" : "") + '>' + s + '</option>'; }).join("") +
          '</select></div>' +
        '</div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Applies to</label><div class="value">' + escapeHtml(c.appliesTo || "—") + '</div></div>' +
          '<div class="field"><label>Design spec</label><div class="value">' + escapeHtml(c.designSpec || "—") + '</div></div>' +
        '</div>' +
        '<div class="field"><label>Acceptance criteria (' + done + '/' + total + ')</label>' + acRows + '</div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Legal owner</label><div class="value">' + escapeHtml(c.legalOwner || "—") + '</div></div>' +
          '<div class="field"><label>Eng owner</label><div class="value">' + escapeHtml(c.engOwner || "—") + '</div></div>' +
        '</div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Test case</label><div class="value">' + escapeHtml(c.testCaseId || "—") + '</div></div>' +
          '<div class="field"><label>Last reviewed</label><div class="value">' + (c.lastReviewed || "—") + (daysAgo(c.lastReviewed) != null ? ' <span style="color:var(--muted)">(' + daysAgo(c.lastReviewed) + 'd ago)</span>' : '') + '</div></div>' +
        '</div>' +
        (c.notes ? '<div class="field"><label>Notes</label><div class="value" style="color:var(--muted)">' + escapeHtml(c.notes) + '</div></div>' : '') +
      '</div>' +
      '<div class="drawer-foot">' + deleteBtn + '<span style="display:flex;gap:8px;"><button class="btn" data-action="copy-md" data-id="' + c.id + '">Copy as issue</button><button class="btn btn-primary" data-action="edit-card" data-id="' + c.id + '">Edit</button></span></div>'
    );
  }

  function acEditRow(a) {
    return (
      '<div class="ac-row" data-ac-row>' +
        '<input type="checkbox" ' + (a && a.done ? "checked" : "") + '>' +
        '<input type="text" value="' + escapeAttr(a ? a.text : "") + '" placeholder="Acceptance criterion…">' +
        '<button type="button" data-action="remove-ac" aria-label="Remove">×</button>' +
      '</div>'
    );
  }

  function renderForm(card) {
    var isEdit = !!card;
    var c = card || { id: nextId(), title: "", source: "", statement: "", appliesTo: "", designSpec: "", riskTier: "P1", ac: [{ text: "", done: false }], testCaseId: "", status: "Draft", legalOwner: "", engOwner: "", lastReviewed: new Date().toISOString().slice(0, 10), notes: "" };

    function opt(v, label, cur) { return '<option value="' + v + '"' + (v === cur ? " selected" : "") + '>' + label + '</option>'; }

    return (
      '<div class="drawer-head"><div><div class="id">' + c.id + '</div><h2>' + (isEdit ? "Edit requirement" : "New requirement") + '</h2></div>' +
        '<button class="btn btn-ghost" data-action="close-drawer" aria-label="Close">✕</button></div>' +
      '<form class="drawer-body" id="cardForm" data-id="' + c.id + '" data-editing="' + (isEdit ? "1" : "0") + '">' +
        '<div class="field"><label>Title</label><input type="text" name="title" required value="' + escapeAttr(c.title) + '"></div>' +
        '<div class="field"><label>Source (statute / case / reg)</label><input type="text" name="source" required value="' + escapeAttr(c.source) + '" placeholder="e.g. Digital Services Act, Art. 28(1)"></div>' +
        '<div class="field"><label>Requirement statement</label><textarea name="statement" required placeholder="The product MUST / MUST NOT / SHOULD…">' + escapeHtml(c.statement) + '</textarea></div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Risk tier</label><select name="riskTier">' + opt("P0", "P0 · Blocking", c.riskTier) + opt("P1", "P1 · Advisory", c.riskTier) + opt("P2", "P2 · Monitor", c.riskTier) + '</select></div>' +
          '<div class="field"><label>Status</label><select name="status">' + STATUSES.map(function (s) { return opt(s, s, c.status); }).join("") + '</select></div>' +
        '</div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Applies to (epic/story)</label><input type="text" name="appliesTo" value="' + escapeAttr(c.appliesTo) + '"></div>' +
          '<div class="field"><label>Design spec section</label><input type="text" name="designSpec" value="' + escapeAttr(c.designSpec) + '"></div>' +
        '</div>' +
        '<div class="field"><label>Acceptance criteria</label><div id="acEditor">' + c.ac.map(acEditRow).join("") + '</div><button type="button" class="ac-add" data-action="add-ac">+ Add acceptance criterion</button></div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Legal owner</label><input type="text" name="legalOwner" value="' + escapeAttr(c.legalOwner) + '"></div>' +
          '<div class="field"><label>Eng owner</label><input type="text" name="engOwner" value="' + escapeAttr(c.engOwner) + '"></div>' +
        '</div>' +
        '<div class="two-col">' +
          '<div class="field"><label>Test case ID</label><input type="text" name="testCaseId" value="' + escapeAttr(c.testCaseId) + '"></div>' +
          '<div class="field"><label>Last reviewed</label><input type="date" name="lastReviewed" value="' + escapeAttr(c.lastReviewed) + '"></div>' +
        '</div>' +
        '<div class="field"><label>Notes</label><textarea name="notes" placeholder="Revision journal, open questions…">' + escapeHtml(c.notes) + '</textarea></div>' +
      '</form>' +
      '<div class="drawer-foot"><button class="btn" data-action="cancel-form">Cancel</button><button class="btn btn-primary" data-action="submit-form">Save requirement</button></div>'
    );
  }

  /* ---------------- CSV / Markdown export ---------------- */
  function csvField(v) {
    v = String(v == null ? "" : v);
    if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function buildCsv() {
    var header = ["LRC ID", "Source (statute/case/reg)", "Risk Tier", "Product Epic/Story", "Design Spec Section", "Acceptance Criteria", "Test Case ID", "Status", "Legal Owner", "Eng Owner", "Last Reviewed"];
    var lines = [header.join(",")];
    state.cards.forEach(function (c) {
      var acStr = c.ac.map(function (a, i) { return "AC" + (i + 1) + " [" + (a.done ? "x" : " ") + "]: " + a.text; }).join(" | ");
      lines.push([c.id, c.source, c.riskTier, c.appliesTo, c.designSpec, acStr, c.testCaseId, c.status, c.legalOwner, c.engOwner, c.lastReviewed].map(csvField).join(","));
    });
    return lines.join("\n");
  }
  function buildMarkdown(c) {
    var acStr = c.ac.map(function (a, i) { return "  - AC" + (i + 1) + ": " + a.text + (a.done ? " (done)" : ""); }).join("\n");
    return (
      "ID: " + c.id + "\n" +
      "Title: " + c.title + "\n" +
      "Source: " + c.source + "\n" +
      "Statement: " + c.statement + "\n" +
      "Applies to: " + (c.appliesTo || "—") + "\n" +
      "Risk tier: " + RISK_LABEL[c.riskTier] + "\n" +
      "Acceptance criteria:\n" + acStr + "\n" +
      "Legal owner: " + (c.legalOwner || "—") + "\n" +
      "Eng owner: " + (c.engOwner || "—") + "\n" +
      "Status: " + c.status
    );
  }
  function copyText(text, flashEl) {
    function flash() { if (flashEl) { flashEl.style.display = "inline"; setTimeout(function () { flashEl.style.display = "none"; }, 1400); } }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, function () { fallbackCopy(text); flash(); });
    } else {
      fallbackCopy(text); flash();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function buildExportJson() {
    return JSON.stringify({ cards: state.cards, meta: state.meta, exportedAt: new Date().toISOString() }, null, 2);
  }
  function exportJson() {
    var data = buildExportJson();
    copyText(data, document.getElementById("exportFlash"));
    try {
      var blob = new Blob([data], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "docket-export-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) {}
  }
  function renderImportModal() {
    var incoming = state.pendingImport.cards.length;
    return (
      '<div class="backdrop open" data-action="cancel-import"></div>' +
      '<div class="modal">' +
        '<h2>Import data</h2>' +
        '<p>This file has ' + incoming + ' requirement card' + (incoming === 1 ? "" : "s") + '. Importing replaces the ' + state.cards.length + ' card' + (state.cards.length === 1 ? "" : "s") + ' currently in this browser — that can\'t be undone.</p>' +
        '<div class="modal-actions"><button class="btn" data-action="cancel-import">Cancel</button><button class="btn btn-primary" data-action="confirm-import">Replace and import</button></div>' +
      '</div>'
    );
  }
  function applyImport() {
    if (!state.pendingImport) return;
    state.cards = state.pendingImport.cards;
    if (state.pendingImport.meta) state.meta = state.pendingImport.meta;
    saveCards(state.cards); saveMeta(state.meta);
    state.pendingImport = null; state.importError = null;
    render();
  }

  /* ---------------- Actions ---------------- */

  function openCard(id) {
    state.selectedId = id; state.drawerOpen = true; state.drawerMode = "view"; state.deleteArmed = null;
    render();
  }
  function closeDrawer() {
    state.drawerOpen = false; state.selectedId = null; state.deleteArmed = null;
    render();
  }

  function readForm(form) {
    var fd = new FormData(form);
    var ac = [];
    form.querySelectorAll("[data-ac-row]").forEach(function (row) {
      var cb = row.querySelector('input[type="checkbox"]');
      var tx = row.querySelector('input[type="text"]');
      if (tx && tx.value.trim()) ac.push({ text: tx.value.trim(), done: !!cb.checked });
    });
    return {
      title: (fd.get("title") || "").trim(),
      source: (fd.get("source") || "").trim(),
      statement: (fd.get("statement") || "").trim(),
      riskTier: fd.get("riskTier"),
      status: fd.get("status"),
      appliesTo: (fd.get("appliesTo") || "").trim(),
      designSpec: (fd.get("designSpec") || "").trim(),
      ac: ac,
      legalOwner: (fd.get("legalOwner") || "").trim(),
      engOwner: (fd.get("engOwner") || "").trim(),
      testCaseId: (fd.get("testCaseId") || "").trim(),
      lastReviewed: fd.get("lastReviewed") || "",
      notes: (fd.get("notes") || "").trim()
    };
  }

  function submitForm() {
    var form = document.getElementById("cardForm");
    if (!form.reportValidity()) return;
    var data = readForm(form);
    var id = form.getAttribute("data-id");
    var editing = form.getAttribute("data-editing") === "1";
    if (editing) {
      var existing = findCard(id);
      Object.assign(existing, data);
    } else {
      state.cards.unshift(Object.assign({ id: id }, data));
    }
    saveCards(state.cards);
    state.selectedId = id; state.drawerMode = "view"; state.drawerOpen = true;
    render();
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");

    switch (action) {
      case "nav":
        state.view = el.getAttribute("data-view");
        render();
        break;
      case "open-card":
        openCard(el.getAttribute("data-id"));
        break;
      case "new-card":
        state.selectedId = null; state.drawerMode = "create"; state.drawerOpen = true;
        render();
        break;
      case "close-drawer":
      case "cancel-form":
        closeDrawer();
        break;
      case "edit-card":
        state.drawerMode = "edit";
        render();
        break;
      case "submit-form":
        submitForm();
        break;
      case "arm-delete":
        state.deleteArmed = el.getAttribute("data-id");
        render();
        break;
      case "confirm-delete":
        var delId = el.getAttribute("data-id");
        state.cards = state.cards.filter(function (c) { return c.id !== delId; });
        saveCards(state.cards);
        closeDrawer();
        break;
      case "add-ac":
        var editor = document.getElementById("acEditor");
        var div = document.createElement("div");
        div.innerHTML = acEditRow(null);
        editor.appendChild(div.firstElementChild);
        break;
      case "remove-ac":
        var row = el.closest("[data-ac-row]");
        if (row) row.remove();
        break;
      case "advance-sprint":
        state.meta.researchSprint += 1;
        saveMeta(state.meta);
        render();
        break;
      case "copy-csv":
        copyText(buildCsv(), document.getElementById("copyFlash"));
        break;
      case "copy-md":
        var mdCard = findCard(el.getAttribute("data-id"));
        if (mdCard) copyText(buildMarkdown(mdCard), null);
        break;
      case "export-json":
        exportJson();
        break;
      case "import-json":
        state.importError = null;
        document.getElementById("importFile").click();
        break;
      case "cancel-import":
        state.pendingImport = null;
        render();
        break;
      case "confirm-import":
        applyImport();
        break;
      case "move-fwd":
      case "move-back": {
        var mc = findCard(el.getAttribute("data-id"));
        if (mc) {
          var idx = STATUSES.indexOf(mc.status);
          var next = action === "move-fwd" ? idx + 1 : idx - 1;
          if (next >= 0 && next < STATUSES.length) { mc.status = STATUSES[next]; saveCards(state.cards); }
        }
        render();
        break;
      }
      default: break;
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target.id === "riskSelect") { state.filters.risk = e.target.value; renderResultsInPlace(); return; }
    if (e.target.id === "statusSelect") { state.filters.status = e.target.value; renderResultsInPlace(); return; }
    if (e.target.id === "sortSelect") { state.filters.sort = e.target.value; renderResultsInPlace(); return; }
    var toggle = e.target.closest('[data-action="toggle-ac"]');
    if (toggle) {
      var c = findCard(toggle.getAttribute("data-id"));
      var idx = parseInt(toggle.getAttribute("data-idx"), 10);
      if (c && c.ac[idx]) { c.ac[idx].done = toggle.checked; saveCards(state.cards); render(); }
      return;
    }
    var qs = e.target.closest('[data-action="quick-status"]');
    if (qs) {
      var qc = findCard(qs.getAttribute("data-id"));
      if (qc) { qc.status = qs.value; saveCards(state.cards); render(); }
      return;
    }
    if (e.target.id === "importFile") {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(reader.result);
          if (!parsed || !Array.isArray(parsed.cards)) throw new Error("bad shape");
          state.pendingImport = parsed;
          state.importError = null;
        } catch (err) {
          state.importError = "That file doesn't look like a Docket export.";
        }
        render();
      };
      reader.readAsText(file);
      return;
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "searchInput") { state.filters.query = e.target.value; renderResultsInPlace(); }
  });

  function renderResultsInPlace() {
    if (state.view === "cards") {
      var rc = document.getElementById("resultsContainer");
      if (rc) rc.innerHTML = renderResultsList();
    } else if (state.view === "matrix") {
      var content = document.getElementById("content");
      if (content) content.innerHTML = renderMatrixView();
    }
  }

  /* Drag and drop for kanban */
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest("[data-drag-id]");
    if (card) e.dataTransfer.setData("text/plain", card.getAttribute("data-drag-id"));
  });
  document.addEventListener("dragover", function (e) {
    var col = e.target.closest('[data-action="kcol"]');
    if (col) { e.preventDefault(); col.classList.add("dragover"); }
  });
  document.addEventListener("dragleave", function (e) {
    var col = e.target.closest('[data-action="kcol"]');
    if (col) col.classList.remove("dragover");
  });
  document.addEventListener("drop", function (e) {
    var col = e.target.closest('[data-action="kcol"]');
    if (!col) return;
    e.preventDefault();
    col.classList.remove("dragover");
    var id = e.dataTransfer.getData("text/plain");
    var c = findCard(id);
    if (c) { c.status = col.getAttribute("data-status"); saveCards(state.cards); }
    render();
  });

  render();
})();
</script>
